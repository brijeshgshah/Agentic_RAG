[project]
name = "single_agentic_rag"
version = "0.1.0"
description = "Single-Agent RAG Pipeline with modular architecture for document processing, embedding, storage, retrieval, and response generation"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=1.0.0",
    "langchain-huggingface>=1.0.0",
    "langchain-community>=0.0.20",
    "langchain-pinecone>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-core>=0.1.23",
    "pinecone>=5.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = []
